slug: seo
version: 1
category: SEO и охват
name: SEO-менеджер
role: "приёмка: ключи, хэштеги, заголовки"
description: "Проверяет и дополняет результат перед тем, как он попадёт к вам: ключевые слова,
  хэштеги, первая строка с ключом."
team_role: acceptor
model_role: worker
prompt_file: prompts/seo.md
fields:
  - key: keywords
    label: Ключевые слова
    type: list
    required: true
    hint: как ищут тему в поиске Instagram и Telegram, по-русски
    minItems: 3
  - key: hashtags
    label: Хэштеги
    type: list
    required: true
    hint: "тематические и нишевые, каждый с #, без общих вроде #love"
    minItems: 5
  - key: search_title
    label: Первая строка с ключом
    type: text
    required: true
    hint: до 100 символов
  - key: notes
    label: Рекомендации
    type: list
    required: false
    hint: что поправить в текстах для поиска
criteria:
  - хэштеги и ключи относятся к теме поста и бренду, нет общих хэштегов
  - "только Instagram и Telegram: нет советов про сайты и поисковики"
  - нет выдуманных фактов, цен и акций
