slug: reels
version: 1
category: Видео
name: Reels
role: идеи и сценарии коротких видео
description: Хук на первые секунды, сценарий по кадрам, подпись, CTA и тексты обложки. Только текст,
  без генерации видео.
team_role: worker
model_role: worker
prompt_file: prompts/reels.md
fields:
  - key: ideas
    label: Идеи
    type: items
    required: true
    hint: ''
    minItems: 1
    fields:
      - key: hook
        label: Хук
        type: text
        hint: ''
      - key: idea
        label: Идея
        type: text
        hint: ''
      - key: duration_sec
        label: Длительность, с
        type: number
        hint: ''
      - key: caption
        label: Подпись
        type: long_text
        hint: ''
      - key: cta
        label: CTA
        type: text
        hint: ''
      - key: cover_texts
        label: Обложка
        type: text
        hint: ''
  - key: scenes
    label: Сцены
    type: items
    required: true
    hint: ''
    minItems: 3
    fields:
      - key: idea
        label: Идея №
        type: number
        hint: ''
      - key: n
        label: Сцена №
        type: number
        hint: ''
      - key: seconds
        label: Секунды
        type: text
        hint: ''
      - key: visual
        label: В кадре
        type: text
        hint: ''
      - key: voiceover
        label: Голос
        type: text
        hint: ''
      - key: onscreen_text
        label: Текст на экране
        type: text
        hint: ''
  - key: hashtags
    label: Хэштеги
    type: list
    required: true
    hint: ''
    minItems: 3
  - key: risk_notes
    label: Риски съёмки
    type: list
    required: false
    hint: ''
criteria:
  - хук срабатывает в первые 3 секунды
  - длительность не больше заданной в брифе (по умолчанию 60 секунд), сцены в сумме дают длительность
  - нет штампов вроде «в современном мире», «не секрет, что»
  - сцены можно снять без спецэффектов, которых нет в брифе
  - звучит голосом бренда
