# Default brand profile. Replace the values with your brand and run /brand reload in the bot.
# Every agent receives this profile; nothing about a specific brand is hard-coded in prompts.
# YAML tip: if a line contains ": " (colon + space), wrap the text in quotes: - 'Цель: продажи'.
slug: default
name: Мой бренд
language: ru
description: >-
  Шаблон профиля. Опишите, чем занимается бренд, что продаёт и чем отличается от других.
audience:
  - 'Кто ваши подписчики: возраст, интересы, что у них болит'
tone:
  - живой разговорный русский
  - на «ты», дружелюбно, без панибратства
  - конкретика вместо общих слов
vocabulary:
  use: []
  avoid: []
# Exact words/phrases that must never appear. "*" at the end matches any ending: "уникальн*".
bannedWords: []
examples: []
# - text: "Пример удачного поста"
#   why: "Чем он хорош"
visualStyle:
  colors: []
  references: []
  notes: ''
formattingRules:
  - Абзацы короткие, 1–3 предложения
  - Эмодзи умеренно, не больше 1–2 на абзац
  - Без капслока и многоточий для драматизма
